<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebook Viewer</title>

<style>
:root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #238636;
    --danger: #f85149;
    --input: #0d1117;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
}

/* ===== Notebook Cell ===== */

.cell {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 20px;
    overflow: hidden;
}

.cell-header {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
}

.cell-body {
    padding: 12px;
}

/* ===== Inputs ===== */

label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
}

input[type="password"],
textarea {
    width: 100%;
    background: var(--input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-family: inherit;
    font-size: 13px;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: #58a6ff;
}

/* ===== Button ===== */

button {
    margin-top: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.1);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* ===== Output ===== */

.output {
    background: #010409;
    border-top: 1px solid var(--border);
    padding: 12px;
    white-space: pre-wrap;
    line-height: 1.5;
}

.error {
    color: var(--danger);
}
</style>
</head>

<body>
<div class="container">

    <!-- INPUT CELL -->
    <div class="cell">
        <div class="cell-header">In [1]</div>
        <div class="cell-body">

            <label>API TOKEN</label>
            <input type="password" id="apiKey" placeholder="••••••••••">

            <label>PROMPT</label>
            <textarea id="prompt" placeholder="# Enter your task here"></textarea>

            <button id="btn" onclick="runQuery()">Run</button>

        </div>
    </div>

    <!-- OUTPUT CELL -->
    <div class="cell">
        <div class="cell-header">Out [1]</div>
        <div class="output" id="output">
            Ready.
        </div>
    </div>

</div>

<script>
async function runQuery() {
    const key = apiKey.value.trim();
    const text = prompt.value.trim();
    const output = document.getElementById('output');
    const btn = document.getElementById('btn');

    if (!key || !text) {
        output.innerHTML = "<span class='error'>Error: missing token or prompt</span>";
        return;
    }

    btn.disabled = true;
    btn.innerText = "Running...";
    output.innerText = "Executing cell...";

    try {
        const response = await fetch(
            'https://ml-ekz.vercel.app/api/proxy',
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ apiKey: key, prompt: text })
            }
        );

        const data = await response.json();

        if (response.ok && data?.candidates?.length) {
            output.innerText = data.candidates[0].content.parts[0].text;
        } else {
            output.innerHTML = "<span class='error'>Empty output</span>\n" +
                JSON.stringify(data, null, 2);
        }

    } catch (e) {
        output.innerHTML = <span class="error">Runtime error: ${e.message}</span>;
    } finally {
        btn.disabled = false;
        btn.innerText = "Run";
    }
}
</script>

</body>
</html>
